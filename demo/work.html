<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scratch work</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; background: #fffdf5; margin: 0; color: #222; }
      .bar { background: #8a6d1d; color: #fff; padding: 12px 24px; font-weight: 600; }
      main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
      textarea { width: 100%; min-height: 280px; font: 18px/1.6 ui-monospace, monospace; padding: 12px; border: 1px solid #d9cfa8; border-radius: 6px; background: #fff; box-sizing: border-box; }
      p { color: #776; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="bar">Scratch pad · show your work here</div>
    <main>
      <p>Pretend this is Google Docs, a whiteboard or your notes app: the place where you write your solution while the homework is open in another tab or window.</p>
      <textarea id="scratch" placeholder="Work out the problem here…" aria-label="Scratch work"></textarea>
    </main>
  </body>
</html>
