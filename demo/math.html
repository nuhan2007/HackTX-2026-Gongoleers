<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculus HW 3.4: Chain Rule</title>
    <style>
      body { font: 16px/1.5 Georgia, serif; background: #f4f5f7; margin: 0; color: #222; }
      .bar { background: #1d3b6f; color: #fff; padding: 12px 24px; font: 600 15px system-ui, sans-serif; }
      main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
      section { background: #fff; border: 1px solid #dde1e7; border-radius: 6px; padding: 20px 24px; margin-bottom: 20px; }
      h2 { font: 600 17px system-ui, sans-serif; margin: 0 0 8px; }
      .math { font-family: 'Cambria Math', 'STIX Two Math', serif; font-size: 19px; }
      input { font: 16px ui-monospace, monospace; padding: 6px 8px; width: 260px; border: 1px solid #aab; border-radius: 4px; }
      button { font: 600 14px system-ui, sans-serif; padding: 7px 14px; background: #1d3b6f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      .feedback { margin-top: 10px; font: 600 14px system-ui, sans-serif; min-height: 20px; }
      .feedback.incorrect { color: #b3261e; }
      .feedback.correct { color: #1b7f3b; }
      .hint { color: #667; font-size: 13px; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div class="bar">MathPractice · Calculus I · Homework 3.4 (Chain Rule)</div>
    <main>
      <section id="q3" data-question="Q3">
        <h2>Question 3</h2>
        <p>Differentiate <span class="math">g(x) = (2x + 1)<sup>3</sup></span>.</p>
        <label>g′(x) = <input data-answer="6(2x+1)^2|6*(2x+1)^2" /></label>
        <button>Check Answer</button>
        <div class="feedback" aria-live="polite"></div>
      </section>

      <section id="q4" data-question="Q4">
        <h2>Question 4</h2>
        <p>Find the derivative of <span class="math">f(x) = (3x<sup>2</sup> + 1)<sup>5</sup></span>.</p>
        <p class="hint">Enter your answer using ^ for exponents, e.g. 2x(x^2+1)^3</p>
        <label>f′(x) = <input data-answer="30x(3x^2+1)^4|30x*(3x^2+1)^4|30*x*(3x^2+1)^4" /></label>
        <button>Check Answer</button>
        <div class="feedback" aria-live="polite"></div>
      </section>
    </main>
    <script>
      const norm = (s) => s.toLowerCase().replace(/\s+/g, '').replace(/\*\*/g, '^');
      for (const sec of document.querySelectorAll('section')) {
        const input = sec.querySelector('input');
        const fb = sec.querySelector('.feedback');
        sec.querySelector('button').addEventListener('click', () => {
          const ok = input.dataset.answer.split('|').map(norm).includes(norm(input.value));
          fb.className = 'feedback';
          fb.textContent = '';
          // Re-render like a real homework site so the feedback is a fresh DOM change each time.
          setTimeout(() => {
            fb.className = 'feedback ' + (ok ? 'correct' : 'incorrect');
            fb.textContent = ok ? '✓ Correct! Nice work.' : '✗ Incorrect. Try again.';
          }, 250);
        });
      }
    </script>
  </body>
</html>
